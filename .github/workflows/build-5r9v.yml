name: Build VALORANT Tracker Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ruwiss/valorant-tracker
          ref: 3634f87e079f268fb637b6f021106a5a706010fc
          path: source

      - name: Apply tracker patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'builder\patch\chunks\part*.txt' -File | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 patch chunks, found $($parts.Count)." }
          $b64 = (($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join '')
          if ($b64.Length -ne 34980) { throw "Patch payload length mismatch: $($b64.Length)." }
          $compressed = [Convert]::FromBase64String($b64)
          $input = [System.IO.MemoryStream]::new($compressed)
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $output = [System.IO.File]::Create((Join-Path $PWD 'tracker.patch'))
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          Set-Location source
          git apply --check ..\tracker.patch
          git apply ..\tracker.patch
          $settingsPath = 'src\components\SettingsPanel.tsx'
          $settings = Get-Content $settingsPath -Raw
          $settings = $settings.Replace('[setHotkey, locale, cancelRecording]', '[setHotkey, cancelRecording]')
          Set-Content -Path $settingsPath -Value $settings -NoNewline
          Write-Host 'Tracker patch applied successfully.'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm -y --no-progress
          $candidates = @(
            'C:\Program Files\NASM',
            'C:\tools\nasm',
            'C:\ProgramData\chocolatey\bin'
          )
          $nasm = $null
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir 'nasm.exe')) {
              $nasm = Join-Path $dir 'nasm.exe'
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append
              break
            }
          }
          if (-not $nasm) {
            $cmd = Get-Command nasm -ErrorAction SilentlyContinue
            if ($cmd) { $nasm = $cmd.Source }
          }
          if (-not $nasm) { throw 'NASM installation succeeded but nasm.exe was not found.' }
          & $nasm -v

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Configure Windows build environment
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll') {
            'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          node --version
          pnpm --version
          rustc --version
          cargo --version
          nasm -v

      - name: Install frontend dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build VALORANT Tracker app and NSIS installer
        working-directory: source
        run: pnpm exec tauri build --bundles nsis

      - name: Collect EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release_output | Out-Null
          $setup = Get-ChildItem -Path 'source\src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup EXE not found.' }
          Copy-Item $setup.FullName 'release_output\VALORANT_Tracker_1.9.3_Setup.exe'
          $portable = Get-ChildItem -Path 'source\src-tauri\target\release' -Filter '*.exe' -File |
            Where-Object { $_.Name -notmatch 'build-script' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $portable) { throw 'Portable application EXE not found.' }
          Copy-Item $portable.FullName 'release_output\VALORANT_Tracker_1.9.3.exe'
          Get-FileHash release_output\*.exe -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload finished Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: valorant-tracker-windows
          path: release_output/*.exe
          if-no-files-found: error
          retention-days: 14
